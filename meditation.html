<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meditation Timer</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        padding-bottom: 80px;
      }

      h1 {
        margin: 0 0 2rem 0;
        text-align: center;
      }

      .timer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2rem;
      }

      .radial-container {
        position: relative;
        width: 360px;
        height: 360px;
      }

      .radial-svg {
        transform: rotate(-90deg);
      }

      .progress-circle {
        transition: stroke-dashoffset 0.5s ease;
      }

      .center-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
      }

      .time-display {
        font-size: 48px;
        font-weight: bold;
        color: #000;
        font-family: monospace;
        line-height: 1;
        letter-spacing: -2px;
      }

      .ready-text {
        font-size: 20px;
        color: #666;
        font-weight: 500;
        text-align: center;
        margin-bottom: 0.5rem;
      }

      .goal-selector {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .goal-selector.active {
        margin-bottom: 0.25rem;
      }

      .goal-display {
        font-size: 32px;
        font-weight: bold;
        color: #000;
        font-family: sans-serif;
        min-width: 80px;
        text-align: center;
      }

      .goal-display.active {
        font-size: 24px;
        min-width: 60px;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: #666;
        transition: opacity 0.2s ease;
      }

      .icon-btn:hover {
        opacity: 0.7;
      }

      .icon-btn.primary {
        color: #000;
        margin-top: 0.25rem;
      }

      .icon-btn.start {
        margin-top: 0;
      }

      .nav-icon {
        width: 36px;
        height: 36px;
      }

      .nav-icon.active {
        width: 32px;
        height: 32px;
      }

      .play-icon {
        width: 72px;
        height: 72px;
      }

      .stop-icon {
        width: 64px;
        height: 64px;
      }

      .history-dots {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 16px;
        background: #f5f5f5;
        flex-wrap: wrap;
      }

      .history-dot {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #e0e0e0;
        color: #999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .history-dot.filled {
        background: #000;
        color: #fff;
      }

      .no-history {
        color: #ccc;
        font-size: 12px;
      }

      .nav-links {
        display: flex;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
      }

      .nav-links a {
        color: #666;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }

      .nav-links a.active {
        color: #000;
      }

      .nav-links a:hover {
        color: #000;
      }
    </style>
  </head>
  <body>
    <nav class="nav-links">
      <a href="index.html">Fasting</a>
      <a href="meditation.html" class="active">Meditation</a>
    </nav>

    <div class="container">
      <div class="timer-container">
        <div class="radial-container">
          <svg class="radial-svg" width="360" height="360">
            <!-- Background circle -->
            <circle
              cx="180"
              cy="180"
              r="172"
              fill="none"
              stroke="#e0e0e0"
              stroke-width="16"
            />
            <!-- Progress circle -->
            <circle
              id="progress-circle"
              cx="180"
              cy="180"
              r="172"
              fill="none"
              stroke="#000000"
              stroke-width="16"
              stroke-dasharray="1080.53"
              stroke-dashoffset="1080.53"
              stroke-linecap="round"
              class="progress-circle"
              style="display: none;"
            />
          </svg>

          <div class="center-content">
            <!-- Ready state -->
            <div id="ready-state">
              <div class="ready-text">Ready to start</div>

              <div class="goal-selector">
                <button class="icon-btn" onclick="handlePreviousGoal()">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="nav-icon" style="transform: rotate(180deg)">
                    <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm14.024-.983a1.125 1.125 0 0 1 0 1.966l-5.603 3.113A1.125 1.125 0 0 1 9 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113Z" clip-rule="evenodd" />
                  </svg>
                </button>

                <div id="goal-display-ready" class="goal-display">10m</div>

                <button class="icon-btn" onclick="handleNextGoal()">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="nav-icon">
                    <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm14.024-.983a1.125 1.125 0 0 1 0 1.966l-5.603 3.113A1.125 1.125 0 0 1 9 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113Z" clip-rule="evenodd" />
                  </svg>
                </button>
              </div>

              <button class="icon-btn start" onclick="startSession()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="play-icon">
                  <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm14.024-.983a1.125 1.125 0 0 1 0 1.966l-5.603 3.113A1.125 1.125 0 0 1 9 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113Z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>

            <!-- Active state -->
            <div id="active-state" style="display: none;">
              <div id="time-display" class="time-display">0:00</div>

              <div class="goal-selector active">
                <button class="icon-btn" onclick="handlePreviousGoal()">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="nav-icon active" style="transform: rotate(180deg)">
                    <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm14.024-.983a1.125 1.125 0 0 1 0 1.966l-5.603 3.113A1.125 1.125 0 0 1 9 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113Z" clip-rule="evenodd" />
                  </svg>
                </button>

                <div id="goal-display-active" class="goal-display active">10m</div>

                <button class="icon-btn" onclick="handleNextGoal()">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="nav-icon active">
                    <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm14.024-.983a1.125 1.125 0 0 1 0 1.966l-5.603 3.113A1.125 1.125 0 0 1 9 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113Z" clip-rule="evenodd" />
                  </svg>
                </button>
              </div>

              <button class="icon-btn primary" onclick="endSession()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="stop-icon">
                  <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm6-2.438c0-.724.588-1.312 1.313-1.312h4.874c.725 0 1.313.588 1.313 1.313v4.874c0 .725-.588 1.313-1.313 1.313H9.564a1.312 1.312 0 0 1-1.313-1.313V9.564Z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="history-container" class="history-dots"></div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>

    <script>
      // Constants
      const GOAL_OPTIONS = [5, 10, 15, 20, 30, 45];
      const DB_KEY = 'meditation_logs';
      const GOAL_KEY = 'meditation_goal';
      const ACTIVE_SESSION_KEY = 'active_meditation';

      // State
      let sessions = [];
      let isActive = false;
      let sessionStart = null;
      let currentMinutes = 0;
      let goalMinutes = 10;
      let updateInterval = null;

      // SVG calculations
      const size = 360;
      const strokeWidth = 16;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;

      // DOM elements
      const progressCircle = document.getElementById('progress-circle');
      const readyState = document.getElementById('ready-state');
      const activeState = document.getElementById('active-state');
      const timeDisplay = document.getElementById('time-display');
      const goalDisplayReady = document.getElementById('goal-display-ready');
      const goalDisplayActive = document.getElementById('goal-display-active');
      const historyContainer = document.getElementById('history-container');

      // Storage functions
      function getSessions() {
        return JSON.parse(localStorage.getItem(DB_KEY) || '[]');
      }

      function saveSession(log) {
        const logs = getSessions();
        logs.push(log);
        localStorage.setItem(DB_KEY, JSON.stringify(logs));
      }

      function getGoal() {
        const stored = localStorage.getItem(GOAL_KEY);
        return stored ? JSON.parse(stored).minutes : 10;
      }

      function setGoalStorage(minutes) {
        localStorage.setItem(GOAL_KEY, JSON.stringify({ minutes }));
      }

      function saveActiveSession(startTime, goalMins) {
        const activeSession = {
          startTime: startTime.toISOString(),
          goalMinutes: goalMins
        };
        localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify(activeSession));
      }

      function getActiveSession() {
        const stored = localStorage.getItem(ACTIVE_SESSION_KEY);
        return stored ? JSON.parse(stored) : null;
      }

      function clearActiveSession() {
        localStorage.removeItem(ACTIVE_SESSION_KEY);
      }

      // UI update functions
      function updateProgressCircle() {
        const progress = Math.min((currentMinutes / goalMinutes) * 100, 100);
        const offset = circumference - (progress / 100) * circumference;
        progressCircle.setAttribute('stroke-dashoffset', offset);
      }

      function updateTimeDisplay() {
        const remainingMinutes = Math.max(0, goalMinutes - currentMinutes);
        const minutes = Math.floor(remainingMinutes);
        const seconds = Math.floor((remainingMinutes % 1) * 60);

        timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      }

      function updateGoalDisplay() {
        goalDisplayReady.textContent = `${goalMinutes}m`;
        goalDisplayActive.textContent = `${goalMinutes}m`;
      }

      function updateUI() {
        if (isActive) {
          readyState.style.display = 'none';
          activeState.style.display = 'flex';
          activeState.style.flexDirection = 'column';
          activeState.style.alignItems = 'center';
          progressCircle.style.display = 'block';
          updateProgressCircle();
          updateTimeDisplay();
        } else {
          readyState.style.display = 'flex';
          readyState.style.flexDirection = 'column';
          readyState.style.alignItems = 'center';
          activeState.style.display = 'none';
          progressCircle.style.display = 'none';
        }
        updateGoalDisplay();
      }

      function renderHistory() {
        // Get start of current week (Monday)
        const today = new Date();
        const dayOfWeek = today.getDay();
        const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const monday = new Date(today);
        monday.setDate(today.getDate() + mondayOffset);
        monday.setHours(0, 0, 0, 0);

        // Create array for 7 days
        const weekDays = [];
        for (let i = 0; i < 7; i++) {
          const day = new Date(monday);
          day.setDate(monday.getDate() + i);
          weekDays.push(day);
        }

        // Map sessions to their end dates
        const sessionsByDay = {};
        sessions.forEach(log => {
          const endDate = new Date(log.end);
          const dateKey = endDate.toDateString();
          // If multiple sessions on same day, use the longest one
          if (!sessionsByDay[dateKey] || parseFloat(log.duration) > parseFloat(sessionsByDay[dateKey].duration)) {
            sessionsByDay[dateKey] = log;
          }
        });

        // Render 7 dots for the week
        const html = weekDays.map(day => {
          const dateKey = day.toDateString();
          const session = sessionsByDay[dateKey];
          if (session) {
            const minutes = Math.floor(parseFloat(session.duration));
            return `<div class="history-dot filled">${minutes}</div>`;
          } else {
            return `<div class="history-dot"></div>`;
          }
        }).join('');

        historyContainer.innerHTML = html;
      }

      // Action functions
      function startSession() {
        const startTime = new Date();
        isActive = true;
        sessionStart = startTime;
        currentMinutes = 0;
        saveActiveSession(startTime, goalMinutes);

        updateInterval = setInterval(() => {
          const now = new Date();
          currentMinutes = (now.getTime() - sessionStart.getTime()) / 60000;
          updateProgressCircle();
          updateTimeDisplay();
        }, 1000);

        updateUI();
      }

      function endSession() {
        if (sessionStart) {
          const endDate = new Date();
          const durationMinutes = (endDate.getTime() - sessionStart.getTime()) / 60000;

          // Only save sessions that are at least 1 minute
          if (durationMinutes >= 1) {
            const newLog = {
              start: sessionStart.toISOString(),
              end: endDate.toISOString(),
              duration: durationMinutes.toFixed(2)
            };
            saveSession(newLog);
          }

          clearActiveSession();
          sessions = getSessions();

          if (updateInterval) {
            clearInterval(updateInterval);
            updateInterval = null;
          }

          isActive = false;
          sessionStart = null;
          currentMinutes = 0;

          updateUI();
          renderHistory();
        }
      }

      function handlePreviousGoal() {
        const currentIndex = GOAL_OPTIONS.indexOf(goalMinutes);
        const previousIndex = currentIndex > 0 ? currentIndex - 1 : GOAL_OPTIONS.length - 1;
        goalMinutes = GOAL_OPTIONS[previousIndex];
        setGoalStorage(goalMinutes);

        if (isActive && sessionStart) {
          saveActiveSession(sessionStart, goalMinutes);
        }

        updateUI();
      }

      function handleNextGoal() {
        const currentIndex = GOAL_OPTIONS.indexOf(goalMinutes);
        const nextIndex = currentIndex < GOAL_OPTIONS.length - 1 ? currentIndex + 1 : 0;
        goalMinutes = GOAL_OPTIONS[nextIndex];
        setGoalStorage(goalMinutes);

        if (isActive && sessionStart) {
          saveActiveSession(sessionStart, goalMinutes);
        }

        updateUI();
      }

      // Initialize
      function init() {
        // Load saved data
        sessions = getSessions();
        goalMinutes = getGoal();

        // Restore active session if exists
        const activeSession = getActiveSession();
        if (activeSession) {
          sessionStart = new Date(activeSession.startTime);
          isActive = true;
          goalMinutes = activeSession.goalMinutes;

          // Start the update interval
          updateInterval = setInterval(() => {
            const now = new Date();
            currentMinutes = (now.getTime() - sessionStart.getTime()) / 60000;
            updateProgressCircle();
            updateTimeDisplay();
          }, 1000);

          // Initial update
          const now = new Date();
          currentMinutes = (now.getTime() - sessionStart.getTime()) / 60000;
        }

        updateUI();
        renderHistory();
      }

      // Run on load
      console.log('Meditation Timer initialized');
      init();
    </script>
  </body>
</html>
